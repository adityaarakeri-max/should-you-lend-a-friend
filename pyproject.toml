[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lend-to-a-friend"
version = "0.1.0"
description = "Should you lend money to a friend? A quick check without bank statements or credit scores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.39.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["lend_check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
